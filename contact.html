<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | DU Matrix</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="index.html" class="logo">
                <img src="DU_Matrix no Bg.png" alt="DU Matrix Logo" style="height: 45px; width: auto; object-fit: contain; display: block;">
                <span>DU Matrix</span>
            </a>
            <div class="nav-links" id="navLinks">
                <button class="close-btn" id="closeBtn" aria-label="Close Menu">&times;</button>
                <a href="index.html">Home</a>
                <a href="bsc-math.html">B.Sc. Math</a>
                <a href="msc-math.html">M.Sc. Math</a>
                <a href="phd.html">Ph.D Math</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search notes...">
                    <div id="searchResults" class="search-results"></div>
                </div>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
            </div>
            <div class="nav-overlay" id="navOverlay"></div>
        </nav>
    </header>
    <main class="container">
        <section class="page-header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Fill out the form below or reach us via social channels.</p>
        </section>
        <section class="cards-grid" style="grid-template-columns: 1fr; max-width: 600px; margin: 0 auto 30px;">
            <div class="card">
                <form id="contactForm" style="display: flex; flex-direction: column; gap: 16px;">
                    <div><label for="name" style="display: block; margin-bottom: 4px; color: var(--text-heading); font-weight: 500;">Your Name</label><input type="text" id="name" name="name" required style="width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary);"></div>
                    <div><label for="email" style="display: block; margin-bottom: 4px; color: var(--text-heading); font-weight: 500;">Your Email</label><input type="email" id="email" name="email" required style="width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary);"></div>
                    <div><label for="message" style="display: block; margin-bottom: 4px; color: var(--text-heading); font-weight: 500;">Message</label><textarea id="message" name="message" rows="5" required style="width: 100%; padding: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); resize: vertical;"></textarea></div>
                    <button type="submit" class="btn" style="align-self: center; padding: 12px 40px; font-size: 1rem;">Send Message</button>
                    <div id="formStatus" style="text-align: center; margin-top: 8px; display: none;"></div>
                </form>
            </div>
        </section>
        <section class="cards-grid">
            <div class="card"><h2>📧 Gmail</h2><p><a href="mailto:dumatrix.du@gmail.com" style="color: #58a6ff; text-decoration: none;">dumatrix.du@gmail.com</a></p><span class="badge">Email</span></div>
            <div class="card"><h2>🧵 Reddit</h2><p><a href="https://www.reddit.com/r/du_matrix" target="_blank" rel="noopener noreferrer" style="color: #58a6ff; text-decoration: none;">r/du_matrix</a></p><span class="badge">Subreddit</span></div>
            <div class="card"><h2>📸 Instagram</h2><p><a href="https://www.instagram.com/du_matrix/" target="_blank" rel="noopener noreferrer" style="color: #58a6ff; text-decoration: none;">@du_matrix</a></p><span class="badge">Instagram</span></div>
        </section>
    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contactForm');
            const status = document.getElementById('formStatus');
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxADJYnyatKzZKadcZBG10PDP8m52ImM2yMIr4pKhssbwTVg7XYck3R-8tWigdklNMXIg/exec';
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    status.style.display = 'block';
                    status.textContent = 'Sending...';
                    status.style.color = '#8b949e';
                    const formData = {
                        name: document.getElementById('name').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        message: document.getElementById('message').value.trim()
                    };
                    fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) })
                    .then(() => {
                        status.textContent = '✅ Message sent successfully!';
                        status.style.color = '#2ea043';
                        form.reset();
                    })
                    .catch(() => {
                        status.textContent = '❌ Failed to send. Please try again.';
                        status.style.color = '#f85149';
                    });
                });
            }
        });
    </script>
</body>
</html>
